name: Atualizar elementais

"on":
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
      timezone: 'America/Sao_Paulo'

permissions:
  contents: write

concurrency:
  group: atualizar-elementais
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
uses: actions/checkout@v6

      - name: Configurar Node.js
  uses: actions/setup-node@v6
  with:
    node-version: '24'
    package-manager-cache: false

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Atualizar catálogo pelo FortniteKing
        run: npm run atualizar

      - name: Validar catálogo
        run: npm run validar

      - name: Salvar alterações
        shell: bash
        run: |
          if git diff --quiet -- elementais.json; then
            echo "Nenhuma alteração no catálogo."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elementais.json
          git commit -m "Atualiza disponibilidade dos elementais"
          git push
